<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAPID鍵の作成</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}code,textarea{font:13px ui-monospace,monospace}textarea{width:100%;height:64px}button{font-size:16px;padding:10px 16px}</style></head>
<body>
<h1>プッシュ通知用の鍵（VAPID）を作る</h1>
<p>このページはブラウザの中だけで鍵を作ります（どこにも送信しません）。作った鍵は SETUP.md の手順どおりに貼り付けてください。</p>
<button id="go">鍵を作る</button>
<h2>公開鍵（Public Key）</h2><p>→ <code>js/config.js</code> の <code>vapidPublicKey</code> と、Supabase の Secret <code>VAPID_PUBLIC_KEY</code></p><textarea id="pub" readonly></textarea>
<h2>秘密鍵（Private Key）</h2><p>→ Supabase の Secret <code>VAPID_PRIVATE_KEY</code> だけ。<b>アプリのファイルやチャットには貼らない。</b></p><textarea id="priv" readonly></textarea>
<script>
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('go').onclick = async () => {
  const k = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  document.getElementById('pub').value = b64u(await crypto.subtle.exportKey('raw', k.publicKey));
  document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', k.privateKey)).d;
};
</script></body></html>
