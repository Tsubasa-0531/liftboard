<meta name="theme-color" content="#d7301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Board">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<header class="top">
  <a class="brand" href="#home" aria-label="Lift Board ホーム"><span class="plate" aria-hidden="true"></span><b>LIFT BOARD</b></a>
  <div id="liveStrip" class="live-strip" aria-live="polite"></div>
  <span id="modeTag" class="mode-tag"></span>
</header>

<main id="view" class="view" tabindex="-1"><p class="loading">読み込み中…</p></main>

<nav class="tabs" aria-label="メイン">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg><span>ホーム</span></a>
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24"><path d="M2 10h3v4H2zM19 10h3v4h-3zM5 7h3v10H5zM16 7h3v10h-3zM8 11h8v2H8z"/></svg><span>記録</span></a>
  <a href="#team" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6zM14.5 20c0-2.6-.8-4.4-2-5.4 1.4-.9 3-1.1 4.5-1.1 2.8 0 5 1.8 5 6.5z"/></svg><span>チーム</span></a>
  <a href="#rank" data-tab="rank"><svg viewBox="0 0 24 24"><path d="M9 4h6v16H9zM2 11h6v9H2zM16 8h6v12h-6z"/></svg><span>ランキング</span></a>
  <a href="#me" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg><span>マイデータ</span></a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" data-close aria-label="閉じる">×</button></header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
</div>
<div id="rest" class="rest" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
